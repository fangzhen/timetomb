[build]
target = "targets/x86_64-elf.json"

[unstable]
build-std= ["core"]
build-std-features = ["compiler-builtins-mem"]

[target.x86_64-unknown-uefi]
linker = "rust-lld"
rustflags = "-C link-arg=/debug:dwarf -C linker-flavor=msvc-lld -Z unstable-options"

[target.'cfg(target_os = "uefi")']
runner = "tools/runner"
